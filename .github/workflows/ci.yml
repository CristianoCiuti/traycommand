name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # GitHub's macOS runners are often unavailable: the job is cancelled after waiting in the
    # queue without running a single step. It must not turn the whole run red.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: End-to-end tests (Electron)
        if: matrix.os == 'windows-latest'
        run: npx playwright test test/e2e/app.spec.ts
      - uses: actions/upload-artifact@v7
        if: always() && matrix.os == 'windows-latest'
        with:
          name: screenshots
          path: test-results/
          if-no-files-found: ignore
