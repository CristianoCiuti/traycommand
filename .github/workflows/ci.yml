name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # main only receives commits already tested on develop: macOS runs there only, because
        # GitHub's macOS runners are scarce (jobs get cancelled without ever starting)
        os: ${{ fromJSON(github.ref == 'refs/heads/main' && '["windows-latest","ubuntu-latest"]' || '["windows-latest","ubuntu-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: End-to-end tests (Electron)
        if: matrix.os == 'windows-latest'
        run: npx playwright test test/e2e/app.spec.ts test/e2e/launcher.spec.ts test/e2e/looks.spec.ts test/e2e/transfer.spec.ts test/e2e/variables.spec.ts test/e2e/confirm.spec.ts test/e2e/lists.spec.ts
      - uses: actions/upload-artifact@v7
        if: always() && matrix.os == 'windows-latest'
        with:
          name: screenshots
          path: test-results/
          if-no-files-found: ignore
