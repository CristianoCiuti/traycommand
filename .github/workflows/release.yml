name: Release

# Push a tag like v2.0.1 (matching package.json "version") to build and publish a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check tag matches package.json
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npm test
      - run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.os }}
          path: |
            packages/*.zip
            packages/*.AppImage
          if-no-files-found: error

  release:
    name: Publish release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist-release
          merge-multiple: true
      - name: Checksums
        working-directory: dist-release
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## "v {f=1; next} /^## / {f=0} f' site/changelog.md > notes.md || true
          test -s notes.md || echo "See the [changelog](https://cristianociuti.github.io/traycommand/changelog)." > notes.md
          printf '\n\nDocumentation: https://cristianociuti.github.io/traycommand/\n' >> notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist-release/* --title "TrayCommand ${GITHUB_REF_NAME#v}" --notes-file notes.md $prerelease
