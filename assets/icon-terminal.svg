<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Phosphor Terminal: a CRT in a cream case, green phosphor prompt and block cursor -->
  <defs>
    <radialGradient id="crt" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#123a24"/>
      <stop offset="1" stop-color="#06140c"/>
    </radialGradient>
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="3" fill="#000000" opacity="0.28"/>
    </pattern>
    <filter id="phosphor" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect x="10" y="10" width="236" height="236" fill="#f2ecdc" stroke="#11241a" stroke-width="8"/>
  <rect x="10" y="214" width="236" height="32" fill="#e3dac2" stroke="#11241a" stroke-width="8"/>
  <rect x="190" y="225" width="36" height="10" fill="#0b6e3f"/>
  <rect x="32" y="32" width="192" height="168" fill="url(#crt)" stroke="#11241a" stroke-width="6"/>
  <g filter="url(#phosphor)" opacity="0.85">
    <path d="M62 82 L106 116 L62 150" fill="none" stroke="#39ff8a" stroke-width="22" stroke-linecap="square"/>
    <rect x="124" y="120" width="56" height="34" fill="#39ff8a"/>
  </g>
  <path d="M62 82 L106 116 L62 150" fill="none" stroke="#7dffb0" stroke-width="18" stroke-linecap="square"/>
  <rect x="124" y="122" width="56" height="30" fill="#7dffb0"/>
  <rect x="35" y="35" width="186" height="162" fill="url(#scan)"/>
</svg>
