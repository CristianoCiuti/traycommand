<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Aurora Glass: an aurora behind a pane of frosted glass, the prompt glowing on it -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b4cf2"/>
      <stop offset="0.5" stop-color="#4b5fe8"/>
      <stop offset="1" stop-color="#1f8fc8"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.22" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#ff7ad9" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff7ad9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.88" r="0.6">
      <stop offset="0" stop-color="#3ff2c8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#3ff2c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.14"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="tile"><rect x="8" y="8" width="240" height="240" rx="60"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="8" y="8" width="240" height="240" fill="url(#sky)"/>
    <rect x="8" y="8" width="240" height="240" fill="url(#glowA)"/>
    <rect x="8" y="8" width="240" height="240" fill="url(#glowB)"/>
    <path d="M-10 120 C 50 70, 120 150, 266 70 L 266 110 C 140 180, 60 110, -10 160 Z" fill="#9ff7e4" opacity="0.28" filter="url(#soft)"/>
  </g>
  <rect x="40" y="56" width="176" height="144" rx="30" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.6" stroke-width="3"/>
  <g filter="url(#soft)" opacity="0.7">
    <path d="M78 102 L112 128 L78 154" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="124" y="142" width="58" height="20" rx="10" fill="#ffffff"/>
  </g>
  <path d="M78 102 L112 128 L78 154" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="124" y="142" width="58" height="20" rx="10" fill="#ffffff"/>
  <rect x="8" y="8" width="240" height="240" rx="60" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
</svg>
